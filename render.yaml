# The backend API as a public sandbox on Render's free plan ($0). Optional: the live app (frontend/,
# Firebase Hosting) does not call it. See README.md, "The backend as a free sandbox".
#
# Everything is kept in memory: checks, cases and the integrity graph start empty after each restart
# or spin-down. Callers are always workers (AUTH_MODE=demo), so the staff routes are closed.
services:
  - type: web
    name: pardes-guard-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ENV
        value: dev
      - key: AUTH_MODE
        value: demo
      - key: LLM_BACKEND
        value: gemini
      # A Google AI Studio key from a project without billing, so it stays on the free tier.
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_FAST
        value: gemini-3.5-flash-lite
      # The default Pro model has no free tier; letters use this free one instead.
      - key: MODEL_PRO
        value: gemini-3.8-flash
      - key: STORE_BACKEND
        value: memory
      - key: GRAPH_BACKEND
        value: memory
      - key: HASH_SALT
        generateValue: true
      - key: EVIDENCE_SIGNING_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://pardes-ea3e1.web.app","https://pardes-ea3e1.firebaseapp.com"]'
